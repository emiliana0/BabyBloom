{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">

                <h1 class="text-center mb-4">Profile</h1>

                <div class="mb-3">
                    <label class="form-label">Username:</label>
                    <p class="form-control-plaintext">{{ current_user.username }}</p>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email:</label>
                    <p class="form-control-plaintext">{{ current_user.email }}</p>
                </div>

            </div>
        </div>

            <div class="card-body p-4">
                <form
                    method="POST"
                    action="{{ url_for('auth.delete_profile') }}"
                    onsubmit="return confirm('Are you sure you want to delete your profile? This cannot be undone.');"
                >
                    <button type="submit" class="btn btn-danger">🗑️ Delete My Profile</button>
                </form>
            </div>

    </div>
</div>
{% endblock %}
