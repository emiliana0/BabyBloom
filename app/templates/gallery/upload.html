{% extends "base.html" %}

{% block content %}


<div class="row justify-content-center">


    <div class="col-md-6">


        <div class="card shadow-sm mt-5">


            <div class="card-body p-4">


                <h1 class="mb-4 text-center">
                    Upload Photo for {{ child.name }}
                </h1>


                <form
                    method="POST"
                    enctype="multipart/form-data"
                >


                    <div class="mb-3">

                        <label
                            for="title"
                            class="form-label"
                        >
                            Title
                        </label>


                        <input
                            type="text"
                            class="form-control"
                            id="title"
                            name="title"
                            required
                        >

                    </div>



                    <div class="mb-3">

                        <label
                            for="description"
                            class="form-label"
                        >
                            Description
                        </label>


                        <textarea
                            class="form-control"
                            id="description"
                            name="description"
                            rows="5"
                        ></textarea>


                    </div>



                    <div class="mb-3">

                        <label
                            for="photo"
                            class="form-label"
                        >
                            Choose Photo
                        </label>


                        <input
                            type="file"
                            class="form-control"
                            id="photo"
                            name="photo"
                            accept=".jpg,.jpeg,.png"
                            required
                        >

                    </div>



                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Upload Photo
                    </button>


                    <a
                        href="{{ url_for(
                            'gallery.list_photos',
                            child_id=child.id
                        ) }}"
                        class="btn btn-secondary ms-2"
                    >
                        Back
                    </a>


                </form>


            </div>


        </div>


    </div>


</div>


{% endblock %}
