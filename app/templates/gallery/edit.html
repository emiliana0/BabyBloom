<h1>
Edit photo
</h1>


<form method="POST">


<label>
Title
</label>

<input
type="text"
name="title"
value="{{ photo.title }}"
>


<br>


<label>
Description
</label>


<textarea
name="description"
>
{{ photo.description }}
</textarea>


<br>


<label>
Date
</label>


<input
type="date"
name="date"
value="{{ photo.upload_date }}"
>


<br>


<button type="submit">
Save
</button>


</form>
