{% extends "base.html" %}

{% block content %}


<div class="d-flex justify-content-between align-items-center mb-4">


    <h1 class="mb-0">
        📷 Gallery of {{ child.name }}
    </h1>


    <a
        href="{{ url_for(
            'gallery.upload_photo',
            child_id=child.id
        ) }}"
        class="btn btn-primary"
    >
        Upload Photo
    </a>


</div>



{% if photos %}


<div class="row g-4">


{% for photo in photos %}


<div class="col-md-4">


    <div class="card shadow-sm h-100">


        <img
            src="{{ url_for(
                'static',
                filename='uploads/' + photo.filename
            ) }}"
            class="card-img-top"
            style="height: 250px; object-fit: cover;"
        >


        <div class="card-body">


            <h5 class="card-title">
                {{ photo.title }}
            </h5>


            <p class="card-text">
                {{ photo.description }}
            </p>


            <p class="text-muted">

                <strong>Date:</strong>

                {{ photo.upload_date }}

            </p>



            <div class="d-flex gap-2">


                <a
                    href="{{ url_for(
                        'gallery.edit_photo',
                        photo_id=photo.id
                    ) }}"
                    class="btn btn-warning"
                >
                    Edit
                </a>



                <form
                    method="POST"
                    action="{{ url_for(
                        'gallery.delete_photo',
                        photo_id=photo.id
                    ) }}"
                >

                    <button
                        type="submit"
                        class="btn btn-danger"
                    >
                        Delete
                    </button>

                </form>


            </div>


        </div>


    </div>


</div>


{% endfor %}


</div>



{% else %}


<div class="alert alert-info">

    No photos yet.

</div>


{% endif %}


{% endblock %}
