{% for child in children %}

<h3>
    {{ child.name }}
</h3>

<p>
    Born:
    {{ child.birth_date }}
</p>


<a href="
{{ url_for(
    'children.edit_child',
    id=child.id
) }}">
    Edit
</a>

<form method="POST" action="{{ url_for('children.delete_child', id=child.id) }}">
    <button type="submit">
        Delete
    </button>
</form>


{% endfor %}
