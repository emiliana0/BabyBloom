<h1>Create child profile</h1>

<form method="POST">

    <label>Name</label>
    <input 
        type="text" 
        name="name"
        required
    >


    <label>Birth date</label>
    <input 
        type="date"
        name="birth_date"
        required
    >


    <button type="submit">
        Create
    </button>

</form>
