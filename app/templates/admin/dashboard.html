{% extends "base.html" %}

{% block content %}

<h1 class="mb-4">
    Admin Panel
</h1>

<div class="row g-4">

    <div class="col-md-4">

        <div class="card h-100 shadow-sm">

            <div class="card-body d-flex flex-column">

                <h5 class="card-title">
                    Advice
                </h5>

                <p class="card-text">
                    Create, edit and delete parenting advice.
                </p>

                <a
                    href="{{ url_for('admin.list_advice') }}"
                    class="btn btn-primary mt-auto align-self-start"
                >
                    Manage Advice
                </a>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card h-100 shadow-sm">

            <div class="card-body d-flex flex-column">

                <h5 class="card-title">
                    Users
                </h5>

                <p class="card-text">
                    Manage registered users and administrator permissions.
                </p>

                <a
                    href="{{ url_for('admin.list_users') }}"
                    class="btn btn-primary mt-auto align-self-start"
                >
                    Manage Users
                </a>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card h-100 shadow-sm">

            <div class="card-body d-flex flex-column">

                <h5 class="card-title">
                    Children
                </h5>

                <p class="card-text">
                    View and manage all child profiles.
                </p>

                <a
                    href="{{ url_for('admin.list_children') }}"
                    class="btn btn-primary mt-auto align-self-start"
                >
                    Manage Children
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
