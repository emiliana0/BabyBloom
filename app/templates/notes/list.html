<h1>
{{ child.name }} notes
</h1>


<a href="
{{ url_for(
'notes.create_note',
child_id=child.id
) }}">
Add note
</a>



{% for note in notes %}

<hr>


<h3>
{{ note.title }}
</h3>


<p>
Category:
{{ note.category.value }}
</p>


<p>
{{ note.content }}
</p>


<a href="
{{ url_for(
'notes.edit_note',
id=note.id
) }}">
Edit
</a>


<form method="POST"
action="
{{ url_for(
'notes.delete_note',
id=note.id
) }}">

<button>
Delete
</button>

</form>


{% endfor %}
